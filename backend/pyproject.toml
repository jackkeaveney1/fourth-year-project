[project]
name = "cyber-range-backend"
version = "0.1.0"
description = "Agentic cyber range: scenario engine, agent orchestrator, and API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "docker>=7.1",
    "jinja2>=3.1",
    "requests>=2.32",
    "anthropic>=0.40",
    "groq>=0.11",
    "google-genai>=1.0",
    "redis>=5.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
